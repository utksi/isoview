# Desktop app (src-tauri/): builds the installers on GitHub's macOS, Windows and Linux machines.
# Push to the desktop branch or run by hand: installers are attached to the run as artifacts.
# Push a tag app-vX.Y.Z: the same, with the Windows exe and installers signed through SignPath (.signpath/README.md),
# plus one draft release holding every installer (publish it by hand).
name: desktop app

on:
  push:
    branches: [desktop]
    tags: ["app-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          # WHY: 22.04, not latest: an AppImage runs on Linux systems whose glibc is at least as new as the builder's.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    env:
      # WHY: only Windows builds of app-v* tags are signed, and only once SignPath is set up (repository variable
      # SIGNPATH_ORGANIZATION_ID; see .signpath/README.md): each request needs a manual approval there.
      SIGN: ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/app-v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Linux libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Unit tests
        if: runner.os == 'Linux'
        run: node tests/run.mjs
      - run: npm ci
      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: npx tauri build --target ${{ matrix.target }}
      # Windows, in two steps so that the exe inside the installers is signed too (Smart App Control checks it):
      # build the exe; on app-v* tags sign it with SignPath; make the installers around it (--no-binary-patching
      # keeps the signature); on tags sign the installers. Every signing request waits for a manual approval in SignPath.
      - name: Build the exe (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }} --no-bundle
      - name: Upload the exe for signing
        id: unsigned-exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: src-tauri/target/${{ matrix.target }}/release/isoview.exe
      - name: Sign the exe (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-exe
      - name: Put the signed exe in place
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/isoview.exe"
          Get-ChildItem signed-exe -Recurse -Filter isoview.exe | Select-Object -First 1 | Copy-Item -Destination $exe -Force
          $s = Get-AuthenticodeSignature $exe; "isoview.exe: $($s.Status), $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { exit 1 }
      - name: Make the installers (Windows)
        if: runner.os == 'Windows'
        run: npx tauri bundle --target ${{ matrix.target }} --no-binary-patching
      - name: Upload the installers for signing
        id: unsigned-installers
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
      - name: Sign the installers (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installers
      - name: Put the signed installers in place
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $b = "src-tauri/target/${{ matrix.target }}/release/bundle"
          Get-ChildItem signed-installers -Recurse -Filter *.msi | Copy-Item -Destination "$b/msi/" -Force
          Get-ChildItem signed-installers -Recurse -Filter *-setup.exe | Copy-Item -Destination "$b/nsis/" -Force
          $bad = 0
          foreach ($f in Get-ChildItem "$b/msi/*.msi", "$b/nsis/*-setup.exe") {
            $s = Get-AuthenticodeSignature $f.FullName; "$($f.Name): $($s.Status)"; if ($s.Status -ne 'Valid') { $bad = 1 } }
          exit $bad
      - uses: actions/upload-artifact@v4
        with:
          name: isoview-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      # Linux: start the app on a virtual display, let it open a sample (ISOVIEW_SMOKE, src-tauri/src/main.rs), then
      # record the X windows (map state, size), the WebKit processes and a screenshot. Variants: the AppImage; the bare
      # binary (system WebKitGTK) alone, under a window manager, without compositing, and without the WebKit sandbox
      # with debug messages. Fails only if the AppImage has quit after 25 s.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils openbox
          app=$(ls $PWD/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          bin=$PWD/src-tauri/target/${{ matrix.target }}/release/isoview
          smoke() {  # smoke NAME WM(yes|no) COMMAND...
            name=$1; wm=$2; shift 2
            xvfb-run -a -s "-ac -screen 0 1600x1000x24" bash -c '
              log=smoke-'$name'.log; : > $log
              if [ '$wm' = yes ]; then openbox > /dev/null 2>&1 & sleep 2; fi
              env ISOVIEW_SMOKE=1 APPIMAGE_EXTRACT_AND_RUN=1 "$@" >> $log 2>&1 & pid=$!
              sleep 25
              { echo "--- windows"; xwininfo -root -tree | grep -v "has no name" | head -30
                for w in $(xwininfo -root -tree | grep -o "0x[0-9a-f]* \"isoview\"" | grep -o "^0x[0-9a-f]*"); do
                  echo "window $w:"; xwininfo -id $w | grep -E "Map State|Width|Height"; done
                echo "--- processes"; ps -eo pid,stat,args | grep -i "[w]ebkit\|[i]soview" | cut -c1-160; } >> $log
              import -window root smoke-'$name'.png
              if kill -0 $pid; then echo "--- running after 25 s" >> $log; kill $pid; exit 0
              else echo "--- quit" >> $log; exit 1; fi' _ "$@" && r=0 || r=1
            echo "===== $name"; tail -80 smoke-$name.log; return $r
          }
          smoke appimage no "$app" && ok=0 || ok=1
          smoke binary no "$bin" || true
          smoke binary-openbox yes "$bin" || true
          smoke binary-nocompositing no env WEBKIT_DISABLE_COMPOSITING_MODE=1 "$bin" || true
          smoke binary-nosandbox-debug no env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 G_MESSAGES_DEBUG=all "$bin" || true
          exit $ok
      - name: Smoke screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: |
            smoke-*.png
            smoke-*.log

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # WHY: one job makes the release; parallel build jobs would each create their own draft.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/**/*

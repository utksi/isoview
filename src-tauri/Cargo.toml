[package]
name = "isoview"
version = "0.1.0"
description = "isoview: crystal structures, volumetric data, WAVECAR orbitals and trajectories, on the desktop"
authors = ["Utkarsh Singh"]
license = "MIT"
repository = "https://github.com/utksi/isoview"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
